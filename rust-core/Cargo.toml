[package]
name = "hypercar_core"
version = "0.1.0"
edition = "2021"
description = "HyperCar 核心层：CarLife 本机回环接收端 + AirPlay 零转码推流（宝马 ID8.5）"

[lib]
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
bytes = "1"
jni = "0.21"
log = "0.4"
android_logger = "0.14"
once_cell = "1"
parking_lot = "0.12"

# 密码学：控制通道/音视频流 ChaCha20-Poly1305、未配对 AES-128-CTR、
# pair-verify X25519/Ed25519、pair-setup SRP-6a(SHA-512, 3072-bit)
chacha20poly1305 = "0.10"
aes = "0.8"
ctr = "0.9"
hkdf = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
num-bigint = "0.4"
num-traits = "0.2"
getrandom = "0.2"

uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
