[package]
name = "hypercar_hub"
version = "0.1.0"
edition = "2021"
description = "PC 侧联调 HU：手机上的 CarLife(MD) → 本机 CarLife HU → WinPlay 的 AirPlay 接收端"

[[bin]]
name = "hypercar-hub"
path = "src/main.rs"

[build-dependencies]
# 把 .ico 编进 exe（windres）
embed-resource = "2"

[dependencies]
# 原生 Win32 窗口（参数面板），不再依赖 PowerShell 脚本
native-windows-gui = "1.0"
# 也不用再借 PowerShell 拉起窗体。
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
bytes = "1"
log = "0.4"
once_cell = "1"
parking_lot = "0.12"

chacha20poly1305 = "0.10"
aes = "0.8"
ctr = "0.9"
hkdf = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
num-bigint = "0.4"
num-traits = "0.2"
getrandom = "0.2"

uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true






